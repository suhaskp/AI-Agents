<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprint Planning Agent</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark">SP</span>
      <div class="brand-text">
        <h1>Sprint Planning Agent</h1>
        <p>Dependency-aware sprint planning from your requirement workbook</p>
      </div>
    </div>
  </div>
</header>

<main class="page">

  <section class="card" id="setup-card">
    <h2 class="card-title">Plan setup</h2>
    <form id="plan-form" class="form-grid">
      <div class="field">
        <label for="project">Project name</label>
        <input type="text" id="project" name="project" placeholder="e.g. Policy Admin Rollout" required>
      </div>
      <div class="field field-narrow">
        <label for="sprints">Sprints</label>
        <input type="number" id="sprints" name="sprints" min="1" max="50" value="4" required>
      </div>
      <div class="field field-narrow">
        <label for="capacity">Capacity / sprint</label>
        <input type="text" id="capacity" name="capacity" placeholder="Optional, e.g. 40 pts">
      </div>
      <div class="field field-wide">
        <label>Requirement workbook</label>
        <div class="file-drop" id="file-drop">
          <input type="file" id="workbook" name="workbook" accept=".xlsx,.xls" required>
          <span id="file-drop-label">Choose or drop the .xlsx / .xls workbook</span>
        </div>
      </div>
      <div class="field field-actions">
        <button type="submit" id="generate-btn" class="btn btn-primary">
          <span class="btn-label">Generate sprint plan</span>
          <span class="spinner" hidden></span>
        </button>
      </div>
    </form>
    <p class="status-line" id="status-line"></p>
  </section>

  <section class="card" id="results-card" hidden>
    <div class="results-header">
      <h2 class="card-title" id="results-title">Sprint plan</h2>
      <button type="button" id="export-btn" class="btn btn-outline">Export to Excel</button>
    </div>

    <div class="tabs" id="sprint-tabs"></div>
    <div id="sprint-panels"></div>

    <div class="summary-grid">
      <div class="summary-block">
        <h3>Planning assumptions</h3>
        <ul id="assumptions-list" class="plain-list"></ul>
      </div>
      <div class="summary-block">
        <h3>Overall risks</h3>
        <ul id="risks-list" class="plain-list"></ul>
      </div>
      <div class="summary-block">
        <h3>Unallocated</h3>
        <ul id="unallocated-list" class="plain-list"></ul>
      </div>
    </div>
  </section>

</main>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
